<title>Cosmos Digital Lab</title>
<style>
:root{color-scheme:dark;--bg:#070b14;--card:#0d1424;--fg:#e8edfa;--muted:#8d9bba;--line:#202c47;--accent:#4f8cff;--err:#ff8f8f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px;text-align:center}
h1{font-size:22px;margin:0 0 6px;background:linear-gradient(120deg,#22d3ee,#8b5cf6 40%,#e879f9 70%,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:var(--muted);font-size:14px;margin:0 0 16px;line-height:1.5}
input,button{font:inherit;width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:#0a101e;color:var(--fg)}
button{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;margin-top:10px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#err{color:var(--err);font-size:13px;min-height:20px;margin-top:10px}
[hidden]{display:none!important}
</style>
</head>
